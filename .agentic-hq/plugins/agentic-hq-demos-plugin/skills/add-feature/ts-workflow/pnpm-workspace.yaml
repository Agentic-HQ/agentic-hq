# Standalone ts-workflow sub-project (AHQ-208 standard file set): a plain
# `pnpm install` run here treats THIS directory as the workspace root (pnpm
# stops at the nearest pnpm-workspace.yaml and never walks up to an enclosing
# repo). The framework link (node_modules/agentic-hq) is created by the
# Workflow Build (scripts/build-workflow.cjs) AFTER the install, not by pnpm.

packages:
  - '.'

# MINIMUM RELEASE AGE (AHQ-152): supply-chain cooldown — refuse to resolve any
# version published < this many MINUTES ago (10080 = 7 days). Matches the repo
# root. pnpm settings do NOT cascade across nested pnpm-workspace.yaml
# boundaries, so each install root must set it explicitly. Only affects new
# resolution (pnpm update / --no-frozen-lockfile); frozen installs are
# unaffected.
minimumReleaseAge: 10080

# FROZEN LOCKFILE (AHQ-152): install exactly pnpm-lock.yaml — if package.json
# and the lockfile disagree, fail instead of silently resolving newer
# versions. (A freshly-scaffolded workflow has no lockfile yet — the first
# install generates it; later installs are frozen against it.) This setting
# MUST live in this pnpm-only file, NOT in a .npmrc: pnpm 11+ reads only
# auth/registry settings from .npmrc (a frozen-lockfile line there is silently
# dead), and npm — which shares .npmrc but has no such setting — prints an
# "Unknown project config" deprecation warning on every command (AHQ-211).
frozenLockfile: true
